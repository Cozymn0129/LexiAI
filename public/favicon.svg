<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション (ダーク・ネオン) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- アイコン・文字グラデーション -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- グロー（発光）エフェクト -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 角丸ベース枠 -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#neon-grad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- バックグラウンドの輝き (Sparkle) -->
  <path d="M 46 14 L 47.5 19.5 L 53 21 L 47.5 22.5 L 46 28 L 44.5 22.5 L 39 21 L 44.5 19.5 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 16 44 L 17 47.5 L 20.5 48.5 L 17 49.5 L 16 53 L 15 49.5 L 11.5 48.5 L 15 47.5 Z" fill="#f472b6" opacity="0.6" />

  <!-- メインロゴ：スタイリッシュな L マーク -->
  <path 
    d="M 22 16 
       C 22 14.895 22.895 14 24 14 
       L 26 14 
       C 27.105 14 28 14.895 28 16 
       L 28 38 
       L 42 38 
       C 43.105 38 44 38.895 44 40 
       L 44 42 
       C 44 43.105 43.105 44 42 44 
       L 24 44 
       C 22.895 44 22 43.105 22 42 
       Z" 
    fill="url(#neon-grad)" 
    filter="url(#glow)"
  />
</svg>
